<!DOCTYPE html>
<html lang="zh-CN" data-pref="auto" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f8" id="metaTheme">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的导航">
<title>我的导航</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
/* 首帧先定主题，避免深色模式白屏闪一下 */
(function () {
  try {
    var p = localStorage.getItem('nav-theme') || 'auto';
    var dark = p === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark';
    var r = document.documentElement;
    r.dataset.pref = p;
    r.dataset.theme = dark ? 'dark' : 'light';
    document.getElementById('metaTheme').content = dark ? '#0b0f17' : '#f4f5f8';
  } catch (e) {}
})();
</script>
<style>
  /* ============ 主题变量 ============ */
  :root {
    --bg: #f4f5f8;
    --fg: #10131a;
    --fg2: #3b4354;
    --muted: #8b93a5;
    --card: #ffffff;
    --card-soft: #ffffffcc;
    --line: #e6e8ef;
    --chip: #eceef4;
    --bar: #f4f5f8e0;
    --accent: #4f46e5;
    --accent-soft: #ece9fe;
    --accent-line: #d9d3fb;
    --accent-fg: #4338ca;
    --ring: #4f46e533;
    --aura1: #a5b4fc55;
    --aura2: #99f6e455;
    --shadow: 0 1px 2px #10131a0a, 0 8px 24px -16px #10131a33;
    --ico-bg: #ffffff;
    --tile-active: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0b0f17;
    --fg: #f2f4f8;
    --fg2: #d3d8e3;
    --muted: #7f8899;
    --card: #141a25;
    --card-soft: #141a25cc;
    --line: #232c3b;
    --chip: #1a212e;
    --bar: #0b0f17d9;
    --accent: #8b8cf7;
    --accent-soft: #1e2340;
    --accent-line: #31365e;
    --accent-fg: #b8b7fb;
    --ring: #8b8cf733;
    --aura1: #4f46e540;
    --aura2: #0e749040;
    --shadow: 0 1px 2px #00000040, 0 10px 30px -18px #00000099;
    --ico-bg: #ffffff;
    --tile-active: #1a212e;
  }

  /* ============ 基础 ============ */
  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: var(--bg);
  }
  body {
    margin: 0;
    min-height: 100svh;
    padding: calc(env(safe-area-inset-top) + 4px) 0 calc(env(safe-area-inset-bottom) + 28px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    transition: background-color .3s ease, color .3s ease;
  }
  body::before {
    content: "";
    position: fixed;
    left: -10%; right: -10%; top: -30vh;
    height: 80vh;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(46% 46% at 18% 0%, var(--aura1), transparent 70%),
      radial-gradient(42% 42% at 88% 8%, var(--aura2), transparent 72%);
    filter: blur(6px);
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 620px;
    margin: 0 auto;
    padding: 0 16px;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ============ 头部：问候 / 时钟 / 主题 ============ */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-top: 20px;
  }
  .greet {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .greet b { font-weight: 500; color: var(--fg2); }
  .clock {
    margin: 4px 0 0;
    font-size: 46px;
    font-weight: 650;
    line-height: 1.02;
    letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .clock .sec {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--muted);
    margin-left: 2px;
  }
  .date {
    margin-top: 7px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .theme-btn {
    flex: none;
    width: 42px;
    height: 42px;
    margin-top: 4px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--card);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .2s ease, background-color .3s ease;
    touch-action: manipulation;
  }
  .theme-btn:active { transform: scale(.92); }
  .theme-btn .ic { display: none; width: 20px; height: 20px; }
  html[data-pref="auto"] .theme-btn .ic-auto,
  html[data-pref="light"] .theme-btn .ic-light,
  html[data-pref="dark"] .theme-btn .ic-dark { display: block; }

  /* ============ 搜索 ============ */
  .search { margin-top: 22px; }
  .searchbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 5px 5px 13px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease, background-color .3s ease;
  }
  .searchbar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px var(--ring);
  }
  .searchbar > svg { flex: none; color: var(--muted); width: 18px; height: 18px; }
  #q {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--fg);
    font-size: 16px; /* 16px 防 iOS 聚焦缩放 */
    padding: 11px 0;
    appearance: none;
  }
  #q::placeholder { color: var(--muted); }
  .go {
    flex: none;
    height: 38px;
    padding: 0 15px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: transform .15s ease, opacity .2s ease;
    touch-action: manipulation;
  }
  .go:active { transform: scale(.95); opacity: .9; }

  .engines {
    display: flex;
    gap: 7px;
    margin-top: 11px;
    padding: 1px 0;
    overflow-x: auto;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }
  .engines::-webkit-scrollbar { display: none; }
  .eng {
    flex: none;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--chip);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s ease, background-color .18s ease, border-color .18s ease;
    touch-action: manipulation;
  }
  .eng.on {
    color: var(--accent-fg);
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }

  /* ============ 分类标签（吸顶） ============ */
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 6;
    margin: 20px -16px 0;
    padding: 10px 16px;
    background: var(--bar);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    transition: background-color .3s ease;
  }
  .tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    padding: 8px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s ease, background-color .18s ease;
    touch-action: manipulation;
  }
  .tab.on {
    background: var(--fg);
    color: var(--bg);
    font-weight: 600;
  }

  /* ============ 站点宫格 ============ */
  .panel { display: none; }
  .panel.on { display: block; animation: rise .3s cubic-bezier(.22, .8, .3, 1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px 4px;
    margin-top: 12px;
  }
  @media (max-width: 339px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(5, 1fr); } }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 2px;
    border-radius: 15px;
    text-decoration: none;
    transition: transform .15s ease, background-color .15s ease;
    touch-action: manipulation;
  }
  .tile:active { transform: scale(.93); background: var(--tile-active); }
  .ico {
    position: relative;
    width: 53px;
    height: 53px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(145deg, var(--a), var(--b));
    box-shadow: 0 7px 16px -10px #000000aa, inset 0 1px 0 #ffffff2e;
    transition: background-color .3s ease;
  }
  .ico i {
    font-style: normal;
    font-size: 21px;
    font-weight: 600;
    color: #fff;
    line-height: 1;
    text-shadow: 0 1px 2px #00000022;
    transition: opacity .2s ease;
  }
  .ico img {
    position: absolute;
    width: 31px;
    height: 31px;
    object-fit: contain;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .ico.loaded { background: var(--ico-bg); }
  .ico.loaded img { opacity: 1; }
  .ico.loaded i { opacity: 0; }
  .nm {
    width: 100%;
    font-size: 11.5px;
    line-height: 1.25;
    color: var(--fg2);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (hover: hover) {
    .tile:hover { background: var(--card); }
  }

  /* ============ 底部 ============ */
  .foot {
    margin: 26px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    letter-spacing: .02em;
    opacity: .85;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="greet"><span id="greet">你好</span></div>
        <div class="clock" aria-label="当前时间">
          <span id="hm">--:--</span><span class="sec" id="ss">:--</span>
        </div>
        <div class="date" id="date">加载中…</div>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换主题">
        <!-- 自动 -->
        <svg class="ic ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3v18" ></path>
          <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none" opacity=".85"></path>
        </svg>
        <!-- 浅色 -->
        <svg class="ic ic-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"></path>
        </svg>
        <!-- 深色 -->
        <svg class="ic ic-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.7 8.7 0 1 0 11 11Z"></path>
        </svg>
      </button>
    </header>

    <section class="search" aria-label="搜索">
      <form class="searchbar" id="searchForm" autocomplete="off" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.6-3.6"></path>
        </svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search"
               placeholder="搜索或输入网址" aria-label="搜索关键词或网址" spellcheck="false">
        <button class="go" type="submit">搜索</button>
      </form>
      <div class="engines" id="engines" role="tablist" aria-label="搜索引擎"></div>
    </section>

    <div class="tabs-wrap">
      <div class="tabs" id="tabs" role="tablist" aria-label="站点分类"></div>
    </div>

    <main id="panels"></main>

    <footer class="foot" id="foot"></footer>
  </div>

<script>
/* =======================================================================
 *  ↓↓↓  只改这里就能变成你自己的导航  ↓↓↓
 *  1. CATS  → 分类和站点：name 显示名，url 网址，color 可选（调色板序号）
 *  2. ENGINES → 搜索框可切换的搜索引擎，%s 处会被替换成关键词
 * ======================================================================= */

const CATS = [
  {
    name: '常用',
    sites: [
      { name: '百度',     url: 'https://www.baidu.com' },
      { name: '必应',     url: 'https://www.bing.com' },
      { name: '淘宝',     url: 'https://www.taobao.com' },
      { name: '京东',     url: 'https://www.jd.com' },
      { name: '哔哩哔哩', url: 'https://www.bilibili.com' },
      { name: '知乎',     url: 'https://www.zhihu.com' },
      { name: '微博',     url: 'https://weibo.com' },
      { name: '小红书',   url: 'https://www.xiaohongshu.com' }
    ]
  },
  {
    name: '数码',
    sites: [
      { name: '华为',     url: 'https://www.huawei.com' },
      { name: 'Apple',    url: 'https://www.apple.com.cn' },
      { name: 'iCloud',   url: 'https://www.icloud.com' },
      { name: '任天堂',   url: 'https://www.nintendo.com.hk' },
      { name: 'GitHub',   url: 'https://github.com' },
      { name: 'DeepSeek', url: 'https://chat.deepseek.com' }
    ]
  },
  {
    name: '社交',
    sites: [
      { name: 'QQ空间',    url: 'https://qzone.qq.com' },
      { name: 'QQ邮箱',    url: 'https://mail.qq.com' },
      { name: '百度贴吧',  url: 'https://tieba.baidu.com' },
      { name: '豆瓣',      url: 'https://www.douban.com' },
      { name: '网易云音乐', url: 'https://music.163.com' },
      { name: '微信读书',  url: 'https://weread.qq.com' }
    ]
  }
];

const ENGINES = [
  { name: '百度', url: 'https://www.baidu.com/s?wd=%s' },
  { name: '必应', url: 'https://www.bing.com/search?q=%s' },
  { name: '知乎', url: 'https://www.zhihu.com/search?type=content&q=%s' },
  { name: 'B站',  url: 'https://search.bilibili.com/all?keyword=%s' },
  { name: '微博', url: 'https://s.weibo.com/weibo?q=%s' }
];

/* —— 图标：false 则只用首字色块，不请求网络 —— */
const USE_FAVICON = true;
/* 直接取站点自己的 favicon，国内网络可用；取不到就自动退回首字色块 */
const faviconUrl = host => `https://${host}/favicon.ico`;

/* ================= 以下一般不用改 ================= */

const PALETTE = [
  ['#6366f1', '#8b5cf6'], ['#0ea5e9', '#22d3ee'], ['#f97316', '#f43f5e'],
  ['#10b981', '#34d399'], ['#f59e0b', '#fbbf24'], ['#ec4899', '#f472b6'],
  ['#3b82f6', '#6366f1'], ['#14b8a6', '#0ea5e9'], ['#ef4444', '#f97316'],
  ['#8b5cf6', '#d946ef']
];
const $ = sel => document.querySelector(sel);

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function domainOf(url) {
  try { return new URL(url).hostname; } catch (e) { return ''; }
}

/* ---------- 站点宫格 ---------- */
const tabsEl = $('#tabs');
const panelsEl = $('#panels');
let total = 0;

CATS.forEach((cat, ci) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (ci === 0 ? ' on' : '');
  tab.type = 'button';
  tab.setAttribute('role', 'tab');
  tab.setAttribute('aria-selected', ci === 0 ? 'true' : 'false');
  tab.textContent = cat.name;
  tab.addEventListener('click', () => select(ci, true));
  tabsEl.appendChild(tab);

  const panel = document.createElement('section');
  panel.className = 'panel' + (ci === 0 ? ' on' : '');
  panel.setAttribute('role', 'tabpanel');

  const grid = document.createElement('div');
  grid.className = 'grid';

  cat.sites.forEach((site, si) => {
    total++;
    const c = PALETTE[(typeof site.color === 'number' ? site.color : hash(site.name) + ci) % PALETTE.length];
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = site.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.style.setProperty('--a', c[0]);
    ico.style.setProperty('--b', c[1]);

    const ch = document.createElement('i');
    ch.textContent = (site.name || '?').trim().slice(0, 1).toUpperCase();
    ico.appendChild(ch);

    if (USE_FAVICON) {
      const host = domainOf(site.url);
      if (host) {
        const img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('load', () => {
          if (img.naturalWidth > 1) ico.classList.add('loaded');
        }, { once: true });
        img.addEventListener('error', () => img.remove(), { once: true });
        img.src = faviconUrl(host);
        ico.appendChild(img);
      }
    }

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = site.name;

    a.append(ico, nm);
    a.setAttribute('aria-label', site.name);
    grid.appendChild(a);
  });

  panel.appendChild(grid);
  panelsEl.appendChild(panel);
});

function select(index, scrollTab) {
  const tabs = [...tabsEl.children];
  const panels = [...panelsEl.children];
  tabs.forEach((t, i) => {
    t.classList.toggle('on', i === index);
    t.setAttribute('aria-selected', i === index ? 'true' : 'false');
  });
  panels.forEach((p, i) => p.classList.toggle('on', i === index));

  if (scrollTab) {
    const t = tabs[index];
    const left = t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2;
    tabsEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
  }
  try { localStorage.setItem('nav-cat', String(index)); } catch (e) {}
}

/* 记住上次所在分类 */
(function restoreCat() {
  try {
    const saved = parseInt(localStorage.getItem('nav-cat'), 10);
    if (saved > 0 && saved < CATS.length) select(saved, false);
  } catch (e) {}
})();

$('#foot').textContent = `共 ${total} 个站点 · 轻点图标即在新标签打开`;

/* ---------- 搜索引擎 ---------- */
const enginesEl = $('#engines');
let engineIndex = 0;
try {
  const saved = parseInt(localStorage.getItem('nav-engine'), 10);
  if (saved >= 0 && saved < ENGINES.length) engineIndex = saved;
} catch (e) {}

ENGINES.forEach((eng, i) => {
  const b = document.createElement('button');
  b.className = 'eng' + (i === engineIndex ? ' on' : '');
  b.type = 'button';
  b.textContent = eng.name;
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', i === engineIndex ? 'true' : 'false');
  b.addEventListener('click', () => {
    engineIndex = i;
    [...enginesEl.children].forEach((el, j) => {
      el.classList.toggle('on', j === i);
      el.setAttribute('aria-selected', j === i ? 'true' : 'false');
    });
    try { localStorage.setItem('nav-engine', String(i)); } catch (e) {}
    $('#q').focus();
  });
  enginesEl.appendChild(b);
});

$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#q').value.trim();
  if (!v) { $('#q').focus(); return; }
  const looksLikeUrl = /^(https?:\/\/)?([\w-]+\.)+[a-zA-Z]{2,}(:\d+)?([/?#][^\s]*)?$/.test(v);
  const target = looksLikeUrl
    ? (/^https?:\/\//i.test(v) ? v : 'https://' + v)
    : ENGINES[engineIndex].url.replace('%s', encodeURIComponent(v));
  window.open(target, '_blank', 'noopener');
});

/* ---------- 时钟 / 日期 / 问候 ---------- */
const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const pad = n => String(n).padStart(2, '0');

function tick() {
  const d = new Date();
  const h = d.getHours();
  const greeting =
    h < 5  ? '夜深了，注意休息' :
    h < 9  ? '早上好' :
    h < 12 ? '上午好' :
    h < 14 ? '中午好' :
    h < 18 ? '下午好' :
    h < 23 ? '晚上好' : '夜深了，早点睡';
  $('#greet').textContent = greeting;
  $('#hm').textContent = `${pad(h)}:${pad(d.getMinutes())}`;
  $('#ss').textContent = `:${pad(d.getSeconds())}`;
  $('#date').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · ${WEEK[d.getDay()]}`;
}
tick();
setInterval(tick, 1000);

/* ---------- 主题：自动 / 浅色 / 深色 ---------- */
const MODES = ['auto', 'light', 'dark'];
const MODE_LABEL = { auto: '跟随系统', light: '浅色', dark: '深色' };
const metaTheme = $('#metaTheme');
const media = matchMedia('(prefers-color-scheme: dark)');

function resolveTheme(pref) {
  return pref === 'auto' ? (media.matches ? 'dark' : 'light') : pref;
}
function applyTheme(pref, persist) {
  const theme = resolveTheme(pref);
  const root = document.documentElement;
  root.dataset.pref = pref;
  root.dataset.theme = theme;
  metaTheme.content = theme === 'dark' ? '#0b0f17' : '#f4f5f8';
  $('#themeBtn').setAttribute('aria-label', `主题：${MODE_LABEL[pref]}，点击切换`);
  $('#themeBtn').title = `主题：${MODE_LABEL[pref]}`;
  if (persist) { try { localStorage.setItem('nav-theme', pref); } catch (e) {} }
}
applyTheme(document.documentElement.dataset.pref || 'auto', false);

$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.pref || 'auto';
  const next = MODES[(MODES.indexOf(cur) + 1) % MODES.length];
  applyTheme(next, true);
});
const onSchemeChange = () => {
  if ((document.documentElement.dataset.pref || 'auto') === 'auto') applyTheme('auto', false);
};
/* 老版本 Safari 只有 addListener */
if (media.addEventListener) media.addEventListener('change', onSchemeChange);
else if (media.addListener) media.addListener(onSchemeChange);

/* ---------- 小优化：/ 聚焦搜索，Esc 清空 ---------- */
document.addEventListener('keydown', e => {
  const q = $('#q');
  if (e.key === '/' && document.activeElement !== q) {
    e.preventDefault();
    q.focus();
  } else if (e.key === 'Escape' && document.activeElement === q) {
    q.value = '';
    q.blur();
  }
});

/* ---------- 离线缓存：只在 https 下生效，本地 file:// 打开会自动跳过 ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
